name: morphiume-staging-runtime

x-runtime: &runtime
  image: ${MORPHIUME_IMAGE:?Set the cryptographically proven immutable engine image ID}
  platform: linux/amd64
  user: "1001:1001"
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 128
  stop_grace_period: 30s
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=128m,uid=1001,gid=1001,mode=1777
  logging:
    driver: local
    options: {max-size: "10m", max-file: "5"}

x-environment: &environment
  NODE_ENV: production
  DEPLOYMENT_ENV: staging
  PAYMENT_PROVIDER: mock
  SMS_PROVIDER: mock
  APP_BASE_URL: ${MORPHIUME_APP_BASE_URL:-http://localhost:3100}
  MEDIA_ROOT: /app/media
  MORPHIUME_RUNTIME_CONFIG: /run/secrets/runtime_config

x-maintenance: &maintenance
  <<: *runtime
  profiles: [maintenance]
  restart: "no"
  environment: *environment
  mem_limit: 384m
  cpus: "0.5"
  networks: [database]
  volumes:
    - type: bind
      source: ${MORPHIUME_OPS_ROOT:?Set the reviewed absolute ops bundle directory}/runtime/db-target.mjs
      target: /run/ops/db-target.mjs
      read_only: true
      bind: {create_host_path: false}

services:
  app:
    <<: *runtime
    restart: unless-stopped
    command: [node, server.js]
    environment: *environment
    mem_limit: 1536m
    cpus: "1.5"
    ports: ["127.0.0.1:3001:3000"]
    networks: [database, edge]
    secrets: [{source: app_runtime, target: runtime_config}]
    volumes:
      - type: bind
        source: /srv/morphiume/staging/runtime/media
        target: /app/media
        bind: {create_host_path: false}
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,uid=1001,gid=1001,mode=1777
      - /app/.next/cache:rw,nosuid,size=128m,uid=1001,gid=1001,mode=0750
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health/ready',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 60s

  worker:
    <<: *runtime
    restart: unless-stopped
    command: [node, --conditions=react-server, runtime/worker.mjs]
    environment:
      <<: *environment
      WORKER_HEARTBEAT_PATH: /tmp/morphiume-worker-heartbeat
    mem_limit: 384m
    cpus: "0.5"
    networks: [database]
    secrets: [{source: worker_runtime, target: runtime_config}]
    volumes:
      - type: bind
        source: /srv/morphiume/staging/runtime/media
        target: /app/media
        bind: {create_host_path: false}
    healthcheck:
      test: [CMD, node, -e, "try{process.exit(Date.now()-require('node:fs').statSync('/tmp/morphiume-worker-heartbeat').mtimeMs<90000?0:1)}catch{process.exit(1)}"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 60s

  check-app:
    <<: *maintenance
    command: [node, --conditions=react-server, /run/ops/db-target.mjs, check-app]
    secrets: [{source: app_runtime, target: runtime_config}]

  check-owner:
    <<: *maintenance
    command: [node, --conditions=react-server, /run/ops/db-target.mjs, check-owner]
    secrets: [{source: migration_runtime, target: runtime_config}]

  migrate:
    <<: *maintenance
    command: [node, --conditions=react-server, /run/ops/db-target.mjs, migrate]
    secrets: [{source: migration_runtime, target: runtime_config}]

  seed:
    <<: *maintenance
    command: [node, --conditions=react-server, /run/ops/db-target.mjs, seed]
    env_file: [/etc/morphiume-staging-runtime/bootstrap.env]
    secrets: [{source: app_runtime, target: runtime_config}]

networks:
  database:
    external: true
    name: morphiume-staging_database
  edge: {}

secrets:
  app_runtime: {file: /etc/morphiume-staging-runtime/app.json}
  worker_runtime: {file: /etc/morphiume-staging-runtime/worker.json}
  migration_runtime: {file: /etc/morphiume-staging-runtime/migration.json}
