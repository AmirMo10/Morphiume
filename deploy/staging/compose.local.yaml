# Isolated developer database only. This never mounts a server filesystem.
name: morphiume-dev
services:
  db:
    image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    platform: linux/amd64
    user: "999:999"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1280m
    cpus: "1.5"
    shm_size: 128m
    stop_grace_period: 60s
    environment:
      POSTGRES_DB: morphiume_staging
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_bootstrap_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --data-checksums
      PGDATA: /var/lib/postgresql/18/docker
    command: [postgres, -c, max_connections=60, -c, shared_buffers=256MB]
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - db_data:/var/lib/postgresql
      - ./initdb.sh:/docker-entrypoint-initdb.d/10-morphiume.sh:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=999,gid=999,mode=1777
      - /var/run/postgresql:rw,nosuid,size=16m,uid=999,gid=999,mode=3775
    secrets: [db_bootstrap_password, db_owner_password, db_app_password]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d morphiume_staging"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging:
      driver: local
      options: {max-size: "10m", max-file: "3"}
volumes:
  db_data: {name: morphiume-dev-pg18}
secrets:
  db_bootstrap_password: {file: ./.local/db_bootstrap_password}
  db_owner_password: {file: ./.local/db_owner_password}
  db_app_password: {file: ./.local/db_app_password}
