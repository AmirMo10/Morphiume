# Temporary integration access: this project/service is the same staging DB.
# The mapping binds loopback only and is removed by full-stack deployment.
name: morphiume-staging
services:
  db:
    image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    platform: linux/amd64
    user: "999:999"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1280m
    cpus: "1.5"
    pids_limit: 128
    shm_size: 128m
    stop_grace_period: 60s
    environment:
      POSTGRES_DB: morphiume_staging
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_bootstrap_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --data-checksums
      PGDATA: /var/lib/postgresql/18/docker
    command: [postgres, -c, max_connections=60, -c, shared_buffers=256MB]
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - type: bind
        source: /srv/morphiume/staging/postgres
        target: /var/lib/postgresql
        bind: {create_host_path: false}
      - type: bind
        source: /opt/morphiume/deploy/staging/initdb.sh
        target: /docker-entrypoint-initdb.d/10-morphiume.sh
        read_only: true
        bind: {create_host_path: false}
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=999,gid=999,mode=1777
      - /var/run/postgresql:rw,nosuid,size=16m,uid=999,gid=999,mode=3775
    secrets: [db_bootstrap_password, db_owner_password, db_app_password]
    networks: [database, management]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d morphiume_staging"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    logging:
      driver: local
      options: {max-size: "10m", max-file: "5"}
networks:
  database: {internal: true}
  management: {}
secrets:
  db_bootstrap_password: {file: /etc/morphiume-staging/db_bootstrap_password}
  db_owner_password: {file: /etc/morphiume-staging/db_owner_password}
  db_app_password: {file: /etc/morphiume-staging/db_app_password}
