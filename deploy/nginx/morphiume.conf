map $http_upgrade $morphiume_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 192.168.240.51;

    server_tokens off;
    client_max_body_size 20m;
    add_header X-Content-Type-Options nosniff always;

    access_log /var/log/nginx/morphiume.access.log;
    error_log /var/log/nginx/morphiume.error.log;

    # Infrastructure probe; application health must be checked separately.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "morphiume server ready\n";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $morphiume_connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        error_page 502 503 504 =503 @app_unavailable;
    }

    location @app_unavailable {
        default_type text/plain;
        return 503 "Morphiume application is not available yet.\n";
    }
}
