title = "Morphiume default rules with exact public profile and migration identity exceptions"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Public SHA256 of the accepted613 access profile in two restore guards and the exact worker-drill report; not an access credential"
condition = "AND"
regexTarget = "secret"
regexes = ['''^3a246edfcd2b1fa6a6754ec848b479e12e12661a6b00947a9d39cf7821b82a1c$''']
paths = ['''^tests/ops/restore-business-(contract\.mjs|remote\.py)$''', '''^docs/ops/WORKER_ALERT_DRILL_591\.json$''']

[[rules.allowlists]]
description = "Exact public SHA256 of the accepted E4 access profile in its restore contract; verified profile digest, not an access credential"
condition = "AND"
regexTarget = "secret"
regexes = ['''^67f77b1636d0ae2b9b81df9e46f4a3c93087b01e0d4e6fdaa730b2604e60dd96$''']
paths = ['''^tests/ops/e4-restore-business-contract\.mjs$''']

[[rules.allowlists]]
description = "Exact public migration filename in schema readiness; not a credential"
condition = "AND"
regexTarget = "secret"
regexes = ['''^0005_bulk_operations\.sql$''']
paths = ['''^src/server/runtime-schema\.ts$''']

[[rules.allowlists]]
description = "Exact canonical public migration2/4 SHA256 values in the preservation guard; verified against SQL bytes"
condition = "AND"
regexTarget = "secret"
regexes = ['''^(e36cd53d36bb82c7af27438a350f089391475213860d7e9aee0ecf052726d524|af97c98d7a3775bad6219cfd3b381b638585acaf9f2c7e74ae1cf1bd0a0ea162)$''']
paths = ['''^deploy/staging/upgrade-original-observation\.mjs$''']
