name: Verify professional demo catalog
on:
  push:
    branches: [main]
    paths:
      - 'deploy/staging/demo-catalog/**'
      - 'tests/ops/demo-catalog.test.mjs'
      - 'tests/ops/demo-catalog.test.py'
      - '.github/workflows/demo-catalog.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
      - name: Validate the committed fictional catalog and actual WebP files
        run: node deploy/staging/demo-catalog/validate.mjs
      - name: Verify finite native API and preservation guards without services
        run: node --test tests/ops/demo-catalog.test.mjs
      - name: Verify observer syntax and non-executing defaults
        run: |
          python3 -I -B -c "import ast,pathlib; ast.parse(pathlib.Path('deploy/staging/demo-catalog/observe.py').read_text())"
          python3 -I -B tests/ops/demo-catalog.test.py
          python3 -I -B deploy/staging/demo-catalog/observe.py
          node deploy/staging/demo-catalog/native.mjs
