name: Verify and build staging image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
        env:
          POSTGRES_USER: morphiume_ci
          POSTGRES_PASSWORD: ephemeral-ci-only
          POSTGRES_DB: morphiume_staging
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U morphiume_ci -d morphiume_staging"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - name: Validate deployment and recovery boundaries without services
        run: |
          python3 deploy/staging/runtime/safety-check.py
          python3 deploy/staging/runtime/upgrade-safety-check.py
          python3 deploy/staging/runtime/preview-safety-check.py
          python3 deploy/staging/runtime/engine-image-safety-check.py
          python3 -B deploy/staging/runtime-preserved-upgrade-safety-check.py
          python3 -B deploy/staging/e4-isolated-restore-safety.py
          python3 -B deploy/staging/e4-preview-lease-bootstrap-safety.py
          python3 -B deploy/staging/e4-preview-perimeter-safety.py
          python3 deploy/staging/extract-ci-artifact-safety.py
          python3 deploy/staging/recover-pre-service-restore-safety.py
          python3 tests/ops/restore-business-remote.test.py
          python3 -B tests/ops/browser-toolchain-import.test.py
          node --test tests/ops/restore-business-contract.test.mjs
          node --test tests/ops/e4-restore-business-contract.test.mjs
          node --test tests/e2e/cart-lifecycle-diagnostics.test.ts
          node --conditions=react-server --import tsx --test tests/e2e/notification-delivery-contract.test.ts
          node --test tests/unit/backend/native-qa-provision.test.mjs
          node --test tests/unit/ops/scheduled-health-measurement.test.mjs
          node --test tests/unit/ops/original-upgrade-observation.test.mjs
          node --test tests/unit/ops/runtime-preservation.test.mjs
          node --test tests/unit/ops/ci-runtime-role.test.mjs tests/unit/ops/ci-image-config.test.mjs
          node --test tests/unit/shared/capacity-evidence.test.mjs
      - name: Scan committed history for exposed credentials
        run: |
          curl --fail --location --silent --show-error --output /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar --extract --gzip --file /tmp/gitleaks.tar.gz --directory /tmp gitleaks
          /tmp/gitleaks git --redact --no-banner
          node scripts/verify-gitleaks-config.mjs /tmp/gitleaks
      - name: Generate isolated synthetic configuration
        run: node scripts/ci-config.mjs
      - name: Initialize separate CI runtime identity
        run: node scripts/ci-runtime-role.mjs --phase initialize
      - run: pnpm db:migrate
      - name: Verify runtime DML after owner migration
        run: node scripts/ci-runtime-role.mjs --phase grants
      - run: pnpm db:seed
      - run: pnpm lint && pnpm typecheck && pnpm test
      - run: pnpm audit --prod --audit-level moderate
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Test all browser engines
        run: |
          pnpm start > .local/ci-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/api/health/ready > /dev/null; then break; fi
            sleep 1
          done
          pnpm test:e2e
      - name: Summarize browser evidence without credentials
        if: always()
        run: node tests/e2e/sanitize-report.mjs
      - name: Export only allowlisted server failure evidence
        if: always()
        run: node tests/e2e/sanitize-server-log.mjs verify-runtime
      - name: Require complete server evidence without unexpected failures
        if: always()
        run: node scripts/accept-server-evidence.mjs verify-runtime
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sanitized-browser-evidence
          path: |
            docs/qa/browser-summary.json
            .local/server-failures-verify.json
          if-no-files-found: ignore
          retention-days: 14
  image:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
        env:
          POSTGRES_USER: morphiume_ci
          POSTGRES_PASSWORD: ephemeral-ci-only
          POSTGRES_DB: morphiume_staging
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U morphiume_ci -d morphiume_staging"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - name: Build and scan immutable staging image before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          mkdir -p .local
          docker buildx create --use
          docker buildx build --file deploy/staging/Dockerfile --build-arg MORPHIUME_SOURCE_COMMIT="$GITHUB_SHA" --tag "$image" --load .
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true --entrypoint node "$image" -e 'process.stdout.write(require("node:fs").readFileSync("/app/morphiume-native-audit.json","utf8"))' > .local/native-audit.json
          curl --fail --location --silent --show-error --output /tmp/grype.tar.gz https://github.com/anchore/grype/releases/download/v0.120.1/grype_0.120.1_linux_amd64.tar.gz
          echo '0a9ee97ef5ae2ee953b0a80098105052e846cdbe319a57d808b519c33cd1343d  /tmp/grype.tar.gz' | sha256sum --check
          tar --extract --gzip --file /tmp/grype.tar.gz --directory /tmp grype
          /tmp/grype "docker:$image" --fail-on high --output json --file .local/image-scan.json
      - name: Prepare private configuration for the built image
        run: |
          node scripts/ci-config.mjs
          node scripts/ci-runtime-role.mjs --phase initialize
          node scripts/ci-image-config.mjs
          sudo chown 1001:1001 .local/image-runtime.json .local/image-migration.json .local/image-media
          pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Execute migration, app, media, auth and worker from the built image
        run: bash scripts/ci-image-smoke.sh
      - name: Require clean server evidence before publishing the image
        run: |
          node tests/e2e/sanitize-server-log.mjs image-runtime
          node scripts/accept-server-evidence.mjs image-runtime
      - name: Publish accepted image with provenance and SBOM
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          candidate="ghcr.io/${GITHUB_REPOSITORY,,}:candidate-${GITHUB_SHA}"
          docker buildx build --file deploy/staging/Dockerfile --build-arg MORPHIUME_SOURCE_COMMIT="$GITHUB_SHA" --tag "$candidate" --provenance=mode=max --sbom=true --metadata-file .local/image-publication.json --push .
          node scripts/ci-image-identity.mjs
          echo "Accepted platform config matched before promoting verified source: $image" >> "$GITHUB_STEP_SUMMARY"
      - name: Export accepted platform image for private server transfer
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          docker save --platform linux/amd64 "$image" | gzip -1 > .local/accepted-image.tar.gz
          cd .local
          sha256sum accepted-image.tar.gz > accepted-image.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: accepted-runtime-image
          path: |
            .local/accepted-image.tar.gz
            .local/accepted-image.sha256
            .local/image-identity.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Summarize image browser evidence without credentials
        if: always()
        run: node tests/e2e/sanitize-report.mjs
      - name: Export only allowlisted image server failure evidence
        if: always()
        run: node tests/e2e/sanitize-server-log.mjs image-runtime
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sanitized-image-evidence
          path: |
            docs/qa/browser-summary.json
            .local/image-scan.json
            .local/image-identity.json
            .local/native-audit.json
            .local/server-failures-image.json
          if-no-files-found: ignore
          retention-days: 14
