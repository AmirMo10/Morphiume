name: Verify and build staging image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
        env:
          POSTGRES_USER: morphiume_ci
          POSTGRES_PASSWORD: ephemeral-ci-only
          POSTGRES_DB: morphiume_staging
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U morphiume_ci -d morphiume_staging"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - name: Scan committed history for exposed credentials
        run: |
          curl --fail --location --silent --show-error --output /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar --extract --gzip --file /tmp/gitleaks.tar.gz --directory /tmp gitleaks
          /tmp/gitleaks git --redact --no-banner
      - name: Generate isolated synthetic configuration
        run: node scripts/ci-config.mjs
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm lint && pnpm typecheck && pnpm test
      - run: pnpm audit --prod --audit-level moderate
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Test all browser engines
        run: |
          pnpm start > .local/ci-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/api/health/ready > /dev/null; then break; fi
            sleep 1
          done
          pnpm test:e2e
      - name: Summarize browser evidence without credentials
        if: always()
        run: node tests/e2e/sanitize-report.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sanitized-browser-evidence
          path: docs/qa/browser-summary.json
          if-no-files-found: ignore
          retention-days: 14
  image:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build and scan immutable staging image before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          docker buildx create --use
          docker buildx build --file deploy/staging/Dockerfile --build-arg MORPHIUME_SOURCE_COMMIT="$GITHUB_SHA" --tag "$image" --load .
          curl --fail --location --silent --show-error --output /tmp/grype.tar.gz https://github.com/anchore/grype/releases/download/v0.120.1/grype_0.120.1_linux_amd64.tar.gz
          echo '0a9ee97ef5ae2ee953b0a80098105052e846cdbe319a57d808b519c33cd1343d  /tmp/grype.tar.gz' | sha256sum --check
          tar --extract --gzip --file /tmp/grype.tar.gz --directory /tmp grype
          /tmp/grype "docker:$image" --fail-on high
          docker buildx build --file deploy/staging/Dockerfile --build-arg MORPHIUME_SOURCE_COMMIT="$GITHUB_SHA" --tag "$image" --provenance=mode=max --sbom=true --push .
          echo "Built image tag tied to verified source: $image" >> "$GITHUB_STEP_SUMMARY"
