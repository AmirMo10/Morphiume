name: Verify UI release operator guards
on:
  push:
    branches: [main]
    paths:
      - 'deploy/staging/ui-release/**'
      - 'tests/ops/ui-release.test.py'
      - 'docs/ops/UI_RELEASE_RUNBOOK.md'
      - '.github/workflows/ui-release.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guards:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify operator code syntax and non-executing defaults
        run: |
          python3 -I -B -c "import ast,pathlib; [ast.parse(p.read_text(), filename=str(p)) for p in pathlib.Path('deploy/staging/ui-release').glob('*.py')]"
          python3 -I -B deploy/staging/ui-release/control.py
          python3 -I -B deploy/staging/ui-release/schedule.py
      - name: Exercise image-only release safety guards without services
        run: python3 -I -B tests/ops/ui-release.test.py
